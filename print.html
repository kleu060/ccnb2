<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Blacklist check</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="d-flex">
        
        <div class="main">
            <div id="header"></div>
            <main id="main-app">

                <div class="mb-2">Requested on <span class="today-date"></span></div>
            
                <table class="table" style="width: fit-content;">
                    <tr>
                        <th scope="row">ID Number</th>
                        <td>820112345678</td>
                    </tr>
                    <tr>
                        <th scope="row">ID Type</th>
                        <td>New IC</td>
                    </tr> 
                    <tr>
                        <th scope="row">Blacklist Status</th>
                        <td>Blacklisted</td>
                    </tr>
                    <tr>
                        <th scope="row">Blacklist Reason</th>
                        <td>Account blacklisted</td>
                    </tr>
                    <tr>
                        <th scope="row">Account Number</th>
                        <td>31230011</td>
                    </tr>
                    <tr>
                        <td>Blacklisted On</td>
                        <td>Dec 22 2025</td>
                    </tr>
                </table>
            </main>

        </div>

    </div>

    <script type="module" src="/js/app.js"></script>
</body>
<script>
    // Display today's date in .today-date span
    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date();
        const formatted = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
        const dateSpans = document.querySelectorAll('.today-date');
        dateSpans.forEach(span => span.textContent = formatted);
    });
</script>
</html>
