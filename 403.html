<!DOCTYPE html>
<html>
<head>
    
    <meta charset="UTF-8">
    <title>Credit Control Portal</title>

    <link rel="stylesheet" href="css/style.css">

    <script type="module">
        // Import your fetch function if it is defined in an external file, e.g.:
        import { getSessionVariable } from "./js/auth/getSessionVariable.js";


        try {
            // 2. Safely await the asynchronous PHP API data
            const variables = await getSessionVariable();
            
            // 3. Attach the frozen array to the window object for global availability
            window.allowed_pages = Object.freeze(variables.allowed_pages || []);
            window.username = variables.username;
            window.force_change_pw = variables.force_change_pw;
            window.group_name = variables.group_name;
            window.latest_id_blacklist_file = variables.latest_id_blacklist_file;
            
        } catch (error) {
            console.error("Failed to load session variables:", error);
            window.allowed_pages = Object.freeze([]);
        }
    </script>
</head>

        <div id="vertical-navbar"></div>

                </div>
            </main>

            <div id="footer"></div>
        </div>
        

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
